name: CI

# CD-53 §4.1「每次变更」门禁的当前可实现子集：语法与类型检查、单元测试、
# 集成测试、回放测试、L0 Schema 正反例、宪法红线扫描。
# L0 Schema 由根目录 `npm test` 收集。红线扫描另有 `npm run redline-scan` step。
# PR Web 预览仍未落地。不要把本流水线描述成"已覆盖 §4.1 全部门禁"（宪法第二十四条）。
#
# GUT 自 2026-09-01 起按目录分层（fast / slow），但**两层都是每次 PR 的门禁**：
# 分层是为了让本地能只跑一层，不是为了把哪一层挪出合并门禁。同日的定点数快路径
# 把整套 GUT 从 354.6 s 压到 24.4 s（开发机），slow 层只剩 7 s，没有任何理由把它
# 移出 PR。口径见 CD-53 §4.1 与 CD-91。
# `--bot-run` 仍不进 PR CI（C2 第一章明确不做），改由 nightly.yml 每天跑一次。

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上只保留最新一次运行，旧的直接取消，避免连续推送时排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 版本的所有者是 CD-51 §1，升级引擎必须同时改那里和本行。
  GODOT_VERSION: 4.7.2
  NODE_VERSION: 24

jobs:
  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 资产预算 step 要读真的 .glb。跳过 LFS 会让它拿到文本指针，
          # 于是门禁在最需要它的时候变红——而且是假红，指向的原因也不对。
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # 宪法第二十三条：backend 与 tools 静态类型、警告视为错误，由 tsconfig 的 strict 系列保证。
      - name: Typecheck
        run: npm run typecheck

      - name: Constitution red-line scan
        run: npm run redline-scan

      # CD-11 §8.1 单资产预算。只判单个资产的准入（面数 / 贴图边长 / 文件体积），
      # 不判场景总量、Draw call、材质数与骨骼上限——那几项仍属 CD-63 §1.7 延期。
      # 校验器只读图像 header，不解码像素，也不依赖 sharp，所以 native 装不上的
      # 平台照样有门禁。仓库当前 0 个 .glb 时它会明说"什么都没查"而不是假绿。
      - name: Single-asset budget
        run: npm run asset-budget

      - name: Unit tests
        run: npm test

  godot:
    name: Godot check-only and GUT
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # GUT 与后续内容资源走 LFS，跳过会让 check-only 读到指针文件而不是真文件。
          lfs: true

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Syntax and type check
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r file; do
            res="res://${file#game/}"
            if ! "$GODOT4" --headless --path game --check-only -s "$res" > /tmp/check.log 2>&1; then
              echo "::error file=${file}::check-only failed"
              cat /tmp/check.log
              failed=1
            fi
          done < <(find game/src game/tests game/addons/authoring_editor -name '*.gd' | sort)
          exit "$failed"

      - name: Headless boot smoke test
        run: "\"$GODOT4\" --headless --path game --quit"

      # job 级 timeout 把超时记成 cancelled 而不是 failure，PR 上看起来像「还在跑」。
      # #176–#180 五刀就是这样带着从未通过的 Godot 门禁合入的，见
      # docs/audits/2026-08-28-ci-gate-timeout.md。这里自己掐一个预算：超了由
      # timeout 结束进程，step 变红并打印下面那行，不再是灰色的 cancelled。
      #
      # 四个目录全跑：fast（unit + integration + replay）+ slow（官方赛道完整搜索）。
      #
      # 5 分钟预算：开发机实测全量 24.4 s，按 CI 慢约 1.5 倍折算约 37 s，留约 8 倍
      # 余量，同时保证在 job 上限之前先触发——预算比 job 上限晚触发就等于没加。
      # 余量给得大是因为这个数刚刚掉了一个数量级（此前 CI 上是 8.9 分钟），还没有
      # CI 实测样本；第一次真跑完之后按下面 "Report slowest test scripts" 的 total
      # 复核并收紧。改测试规模时一并复核。
      - name: GUT unit, integration, replay, and slow tests
        run: |
          set -uo pipefail
          timeout -k 30 300 "$GODOT4" --headless --path game \
            -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit,res://tests/integration,res://tests/replay,res://tests/slow \
            -gjunit_xml_file=res://.gut-results.xml -gexit
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::GUT 超过 5 分钟预算被终止。这是失败，不是排队。"
          fi
          exit "$status"

      # 单个脚本慢慢变慢在此之前没有任何信号，直到它一次吃光整个预算。
      # 这一步不判定，只把耗时打出来，好让下一次变慢在 PR 里看得见。
      - name: Report slowest test scripts
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          results = pathlib.Path("game/.gut-results.xml")
          if not results.exists():
              print("no .gut-results.xml: GUT never reached the export step.")
              raise SystemExit(0)
          root = ET.parse(results).getroot()
          suites = sorted(
              ((float(s.get("time", 0.0)), s.get("name", "?")) for s in root),
              reverse=True,
          )
          print(f"{'seconds':>8}  test script")
          for seconds, name in suites[:10]:
              print(f"{seconds:8.1f}  {name}")
          print(f"{sum(s for s, _ in suites):8.1f}  total over {len(suites)} scripts")
          PY
