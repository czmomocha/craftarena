name: CI

# CD-53 §4.1「每次变更」门禁的当前可实现子集：语法与类型检查、单元测试、
# 集成测试、回放测试、L0 Schema 正反例、宪法红线扫描。
# L0 Schema 由根目录 `npm test` 收集。红线扫描另有 `npm run redline-scan` step。
# PR Web 预览仍未落地。不要把本流水线描述成"已覆盖 §4.1 全部门禁"（宪法第二十四条）。
# `--bot-run` 不进 CI（C2 第一章明确不做；45 秒搜索不是每次变更门禁）。

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上只保留最新一次运行，旧的直接取消，避免连续推送时排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 版本的所有者是 CD-51 §1，升级引擎必须同时改那里和本行。
  GODOT_VERSION: 4.7.2
  NODE_VERSION: 24

jobs:
  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # 宪法第二十三条：backend 与 tools 静态类型、警告视为错误，由 tsconfig 的 strict 系列保证。
      - name: Typecheck
        run: npm run typecheck

      - name: Constitution red-line scan
        run: npm run redline-scan

      - name: Unit tests
        run: npm test

  godot:
    name: Godot check-only and GUT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # GUT 与后续内容资源走 LFS，跳过会让 check-only 读到指针文件而不是真文件。
          lfs: true

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/"${name}"

      - name: Expose GODOT4
        run: echo "GODOT4=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Report engine version
        run: "\"$GODOT4\" --version"

      # 干净检出没有 .godot 导入缓存，后面的 check-only 和 GUT 都依赖它先生成。
      - name: Import resources
        run: "\"$GODOT4\" --headless --path game --import"

      - name: Syntax and type check
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r file; do
            res="res://${file#game/}"
            if ! "$GODOT4" --headless --path game --check-only -s "$res" > /tmp/check.log 2>&1; then
              echo "::error file=${file}::check-only failed"
              cat /tmp/check.log
              failed=1
            fi
          done < <(find game/src game/tests game/addons/authoring_editor -name '*.gd' | sort)
          exit "$failed"

      - name: Headless boot smoke test
        run: "\"$GODOT4\" --headless --path game --quit"

      # job 级 timeout 把超时记成 cancelled 而不是 failure，PR 上看起来像「还在跑」。
      # #176–#180 五刀就是这样带着从未通过的 Godot 门禁合入的，见
      # docs/audits/2026-08-28-ci-gate-timeout.md。这里自己掐 10 分钟预算：
      # 超了由 timeout 结束进程，step 变红并打印下面那行，不再是灰色的 cancelled。
      - name: GUT unit, integration, and replay tests
        run: |
          set -uo pipefail
          timeout -k 30 600 "$GODOT4" --headless --path game \
            -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit,res://tests/integration,res://tests/replay \
            -gjunit_xml_file=res://.gut-results.xml -gexit
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::GUT 超过 10 分钟预算被终止。这是失败，不是排队。"
          fi
          exit "$status"

      # 单个脚本慢慢变慢在此之前没有任何信号，直到它一次吃光整个预算。
      # 这一步不判定，只把耗时打出来，好让下一次变慢在 PR 里看得见。
      - name: Report slowest test scripts
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          results = pathlib.Path("game/.gut-results.xml")
          if not results.exists():
              print("no .gut-results.xml: GUT never reached the export step.")
              raise SystemExit(0)
          root = ET.parse(results).getroot()
          suites = sorted(
              ((float(s.get("time", 0.0)), s.get("name", "?")) for s in root),
              reverse=True,
          )
          print(f"{'seconds':>8}  test script")
          for seconds, name in suites[:10]:
              print(f"{seconds:8.1f}  {name}")
          print(f"{sum(s for s, _ in suites):8.1f}  total over {len(suites)} scripts")
          PY
