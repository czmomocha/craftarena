# Craft Arena test-period Web static (M-Export second knife).
#
# Plaintext HTTP only. Do not add `listen 443` here — public TLS is after M7.
# Do not put a real IP or domain in `server_name`. Testers open `http://<SERVER_HOST>/`.
# `root` must match CRAFTARENA_WEB_DEPLOY_PATH (default /var/www/craftarena-web).
#
# Current Web preset is nothreads (`variant/thread_support=false`). Do not add
# Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy until that flips,
# and do not introduce WebRTC.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/craftarena-web;
    index index.html;

    # Godot Web. application/wasm is missing from older mime.types.
    types {
        text/html                             html htm;
        application/javascript                js;
        application/wasm                      wasm;
        application/octet-stream              pck;
        image/png                             png;
        image/x-icon                          ico;
        application/json                      json;
        text/css                              css;
    }
    default_type application/octet-stream;

    # Testers must see THIS export, not a cached previous pck.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
